services:
  # ClipLane Background Processing Worker (Node.js 22 + FFmpeg)
  # Uses type: web so it runs on Render's 100% Free Plan ($0/mo) with health check
  - type: web
    name: cliplane-worker
    runtime: docker
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_IMMEDIATELY
        value: "true"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: RETENTION_DAYS
        value: "3"
